name: Build Native Fullscreen APK
on:
  push:
    branches: [ "main", "master" ]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Compile HTML to Immersive Android APK
        uses: darkshredder/web-to-app-action@v1.1.2
        with:
          build-folder-path: "./"
          app-name: "NenoWordGame"

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NativeFullscreenAPK
          path: ./*.apk

