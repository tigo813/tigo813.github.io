
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neno — Swahili Word Puzzle Game</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        /* Reset scrollbars, margins, and paddings for native-like app experience */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
        }
        iframe, embed, object {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Your main game loop, layout, canvas or iframe container goes here -->

<script>
// Main JavaScript engine to force and lock fullscreen mode
function forceFullscreen() {
    const docEl = document.documentElement;
    const requestMethod = docEl.requestFullscreen || 
                          docEl.mozRequestFullScreen || 
                          docEl.webkitRequestFullScreen || 
                          docEl.msRequestFullscreen;

    if (requestMethod) {
        requestMethod.call(docEl).then(() => {
            // Lock screen orientation to portrait mode once fullscreen is successful
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock("portrait").catch(function(error) {
                    console.log("Orientation lock rejected by browser:", error);
                });
            }
        }).catch(err => {
            console.log("Error entering fullscreen mode:", err);
        });
    }
}

// Fullscreen requires user interaction; triggers on first tap or click
window.addEventListener("click", forceFullscreen);
window.addEventListener("touchstart", forceFullscreen);

// Monitor fullscreen state change; re-force if user tries to exit (Anti-exit system)
document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement) {
        console.log("System restriction detected! Re-locking fullscreen...");
        setTimeout(forceFullscreen, 1000); // Retries after 1 second
    }
});

// Additional fallback listener for WebKit / Safari based engines
document.addEventListener("webkitfullscreenchange", () => {
    if (!document.webkitFullscreenElement) {
        setTimeout(forceFullscreen, 1000);
    }
});
</script>
</body>
</html>
